apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamer
  template:
    metadata:
      labels:
        app: streamer
    spec:
      containers:
        - name: streamer
          image: streamer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CSV_FILE
              value: "/data/telemetry.csv"
            - name: MQ_URL
              value: "http://mq-service"
            - name: TOPIC
              value: "telemetry"
            - name: STREAM_INTERVAL_MS
              value: "500"
          volumeMounts:
            - name: telemetry-data
              mountPath: /data
      volumes:
        - name: telemetry-data
          configMap:
            name: telemetry-csv