---
# PostgreSQL StatefulSet with persistent storage
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry

---
# Secret for PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: telemetry
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: telemetry-secure-password-change-in-production
  POSTGRES_DB: telemetry

---
# PersistentVolumeClaim for PostgreSQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Service for PostgreSQL (headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: telemetry
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: postgres

---
# StatefulSet for PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: telemetry
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1  # Single PostgreSQL instance (change to 3+ for HA with streaming replication)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgresql
        
        # Environment variables
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        
        # PostgreSQL configuration via command line
        command:
          - sh
          - -c
          - |
            # Set PostgreSQL parameters
            echo "shared_buffers=256MB" >> /var/lib/postgresql/data/postgresql.conf || true
            echo "max_connections=200" >> /var/lib/postgresql/data/postgresql.conf || true
            echo "effective_cache_size=1GB" >> /var/lib/postgresql/data/postgresql.conf || true
            
            # Start PostgreSQL
            docker-entrypoint.sh postgres
        
        # Health checks
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres -d telemetry
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres -d telemetry
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Volume mounts
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      
      # Security context
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      
      # Init container to fix permissions
      initContainers:
      - name: fix-permissions
        image: alpine:3.18
        command:
          - sh
          - -c
          - chmod -R 700 /var/lib/postgresql/data || true
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      
      volumes: []

  # Volume claim template for StatefulSet
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app: postgres
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
# Collector Deployment configured to use PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: telemetry
  labels:
    app: collector
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      # DNS policy for reliable DNS resolution
      dnsPolicy: ClusterFirst
      
      # Init container to wait for PostgreSQL
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL..."
            until nc -z postgres.telemetry.svc.cluster.local 5432; do
              echo "PostgreSQL is unavailable - sleeping"
              sleep 2
            done
            echo "PostgreSQL is up - executing collector"
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      
      containers:
      - name: collector
        image: collector:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        
        # Environment variables
        env:
        # MQ Configuration
        - name: MQ_URL
          value: "http://mq-service:8080"
        - name: TOPIC
          value: "telemetry"
        - name: GROUP
          value: "collector-group"
        
        # Collector Configuration
        - name: PARTITIONS
          value: "3"
        - name: BATCH_SIZE
          value: "10"
        - name: POLL_INTERVAL_MS
          value: "500"
        
        # PostgreSQL Configuration
        - name: DB_DSN
          value: "postgres://postgres:telemetry-secure-password-change-in-production@postgres.telemetry.svc.cluster.local:5432/telemetry?sslmode=disable"
        
        # Kubernetes pod name (useful for tracking)
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resource limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      # Pod-level security context
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      
      # Service account
      serviceAccountName: collector
      
      # Affinity rules for better distribution
      affinity:
        # Pod anti-affinity to spread replicas across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - collector
              topologyKey: kubernetes.io/hostname
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      
      # Restart policy
      restartPolicy: Always
      
      # Grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

---
# Service for Collector
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: telemetry
  labels:
    app: collector
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: collector
  sessionAffinity: None

---
# ServiceAccount for Collector
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: telemetry
  labels:
    app: collector

---
# Role for Collector (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector
  namespace: telemetry
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

---
# RoleBinding for Collector
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collector
  namespace: telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: collector
subjects:
- kind: ServiceAccount
  name: collector
  namespace: telemetry

---
# HorizontalPodAutoscaler for Collector
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collector-hpa
  namespace: telemetry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collector
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# NetworkPolicy to allow only necessary traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-network-policy
  namespace: telemetry
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: telemetry
    - namespaceSelector:
        matchLabels:
          name: default
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8080

---
# PodDisruptionBudget to ensure availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collector-pdb
  namespace: telemetry
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: collector
