# Default values for gpu-pipeline Helm chart

namespace: gpu-pipeline

# PostgreSQL Configuration
postgres:
  image: postgres:15-alpine
  replicas: 1
  port: 5432
  user: user
  password: pass
  database: telemetry
  storage: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# MQ Configuration
mq:
  image: mq-server:latest
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Collector Configuration
collector:
  image: collector:latest
  replicas: 2
  port: 8081
  mq_url: "http://mq-service:8080"
  topic: "telemetry"
  group: "collector-group"
  partitions: 3
  batch_size: 10
  poll_interval_ms: 500
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# Streamer Configuration
streamer:
  image: streamer:latest
  replicas: 2
  mq_url: "http://mq-service:8080"
  topic: "telemetry"
  stream_interval_ms: 500
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # Storage configuration for telemetry CSV file
  # Supports: hostPath | rwx | remote | embedded
  storage:
    type: embedded  # Change to: hostPath, rwx, remote, or embedded
    
    # hostPath mode (KIND local development)
    # Pod will be scheduled on the specified node
    hostPath:
      enabled: false
      path: /data
      nodeName: kind-control-plane
    
    # RWX mode (Multi-node Kubernetes)
    # Requires NFS or other RWX storage provisioner
    rwx:
      enabled: false
      storageClassName: nfs-client
      size: 1Gi
      accessModes:
        - ReadWriteMany
    
    # Remote fetch mode (HTTP/S3)
    # Downloads CSV from remote URL on pod startup
    remote:
      enabled: false
      url: "https://example.com/data.csv"
      retries: 3
      retryDelay: 5  # seconds
    
    # Embedded mode (CSV built into Docker image)
    # Default mode - CSV is in the image at build time
    embedded:
      enabled: true
  
  # CSV file configuration
  csv:
    path: /data
    fileName: telemetry.csv
    waitTimeout: 120  # seconds to wait for file
  
  # Init container configuration
  initContainer:
    image: busybox:latest
    retryCount: 30
    retryDelay: 2  # seconds

# API Gateway Configuration
apiGateway:
  image: gpu-pipeline/api-gateway:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  service:
    type: ClusterIP
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Image pull policy
imagePullPolicy: IfNotPresent

