apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.apiGateway.service.type | default "NodePort" }}
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: api-gateway
