apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamer
  namespace: {{ .Values.namespace }}
  labels:
    app: streamer
    version: "{{ .Chart.Version }}"
spec:
  replicas: {{ .Values.streamer.replicas }}
  selector:
    matchLabels:
      app: streamer
  template:
    metadata:
      labels:
        app: streamer
    spec:
      containers:
        - name: streamer
          image: {{ .Values.streamer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: CSV_FILE
              value: "{{ .Values.streamer.csv_file }}"
            - name: MQ_URL
              value: "http://mq-service:{{ .Values.mq.port }}"
            - name: TOPIC
              value: "{{ .Values.streamer.topic }}"
            - name: STREAM_INTERVAL_MS
              value: "{{ .Values.streamer.stream_interval_ms }}"
          resources:
            {{- toYaml .Values.streamer.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps aux | grep -q streamer | grep -v grep
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: telemetry-data
              mountPath: /data
      volumes:
        - name: telemetry-data
          configMap:
            name: telemetry-csv
