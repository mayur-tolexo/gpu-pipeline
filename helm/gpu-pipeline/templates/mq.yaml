apiVersion: v1
kind: ConfigMap
metadata:
  name: mq-config
  namespace: {{ .Values.namespace }}
  labels:
    app: mq
    version: "{{ .Chart.Version }}"
data:
  config.json: |
    {
      "listen": "{{ .Values.mq.config.listen }}",
      "partitions": {{ .Values.mq.config.partitions }},
      "partition_capacity": {{ .Values.mq.config.partition_capacity }},
      "compaction_enabled": {{ .Values.mq.config.compaction_enabled }},
      "compaction_interval": "{{ .Values.mq.config.compaction_interval }}",
      "compaction_threshold": {{ .Values.mq.config.compaction_threshold }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mq
  namespace: {{ .Values.namespace }}
  labels:
    app: mq
    version: "{{ .Chart.Version }}"
spec:
  replicas: {{ .Values.mq.replicas }}
  selector:
    matchLabels:
      app: mq
  template:
    metadata:
      labels:
        app: mq
    spec:
      containers:
        - name: mq
          image: {{ .Values.mq.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.mq.port }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.mq.port }}"
            - name: CONFIG_PATH
              value: "/etc/mq/config.json"
          volumeMounts:
            - name: config
              mountPath: /etc/mq
              readOnly: true
          resources:
            {{- toYaml .Values.mq.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mq.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mq.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: mq-config
            items:
              - key: config.json
                path: config.json
