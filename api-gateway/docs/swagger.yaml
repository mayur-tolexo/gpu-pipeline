basePath: /
definitions:
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.ListGPUsResponse:
    properties:
      count:
        type: integer
      gpus:
        items:
          type: string
        type: array
    type: object
  models.QueryTelemetryResponse:
    properties:
      count:
        type: integer
      end_time:
        type: string
      fields_available:
        items:
          type: string
        type: array
      gpu_id:
        type: string
      records:
        items:
          $ref: '#/definitions/models.TelemetryResponse'
        type: array
      start_time:
        type: string
    type: object
  models.TelemetryResponse:
    properties:
      data:
        additionalProperties: true
        type: object
      gpu_id:
        type: string
      timestamp:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: Query GPU telemetry data from the central database
  license: {}
  termsOfService: http://swagger.io/terms/
  title: GPU Pipeline API Gateway
  version: "1.0"
paths:
  /api/v1/gpus:
    get:
      description: Get a list of all unique GPU IDs that have telemetry data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ListGPUsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all unique GPUs
      tags:
      - GPUs
  /api/v1/gpus/{id}/telemetry:
    get:
      description: |-
        Get all telemetry entries for a specific GPU, ordered by time
        Supports optional time window filters with start_time and end_time query parameters (RFC3339 format)
      parameters:
      - description: GPU ID
        in: path
        name: id
        required: true
        type: string
      - description: Start time (RFC3339 format)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339 format)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Telemetry data for GPU
          schema:
            $ref: '#/definitions/models.QueryTelemetryResponse'
        "400":
          description: Invalid time format or missing GPU ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: GPU not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Database query error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get telemetry for a specific GPU
      tags:
      - Telemetry
  /api/v1/health:
    get:
      description: Check if the API gateway is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
swagger: "2.0"
