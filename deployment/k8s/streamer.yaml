apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamer
  namespace: gpu-pipeline
  labels:
    app: streamer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamer
  template:
    metadata:
      labels:
        app: streamer
    spec:
      containers:
        - name: streamer
          image: streamer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CSV_FILE
              value: "/data/telemetry.csv"
            - name: MQ_URL
              value: "http://mq-service:8080"
            - name: TOPIC
              value: "telemetry"
            - name: STREAM_INTERVAL_MS
              value: "5000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps aux | grep -q streamer | grep -v grep
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: telemetry-data
              mountPath: /data
      volumes:
        - name: telemetry-data
          configMap:
            name: telemetry-csv