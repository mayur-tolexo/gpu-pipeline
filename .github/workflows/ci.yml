name: CI

on:
  push:
    branches: [ main, core-mq-base ]
  pull_request:
    branches: [ main, core-mq-base ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Run tests
        run: go test ./... -v

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          tags: mq:latest
